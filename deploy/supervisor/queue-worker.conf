; Supervisor configuration for the ScopeWise AI queue worker.
;
; Install:
;   sudo cp deploy/supervisor/queue-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status scopewise-worker:*
;
; The "analysis" queue is listed first so requirement analysis is prioritised
; over default jobs.

[program:scopewise-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/scopewise-ai-backend/artisan queue:work --queue=analysis,default --sleep=3 --tries=3 --max-time=3600 --max-jobs=500 --memory=256
directory=/var/www/scopewise-ai-backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

; Give the worker time to finish the job it is holding before SIGKILL.
stopwaitsecs=30

user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/scopewise-ai-backend/storage/logs/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

; Queue connection is intentionally NOT overridden here: it must match the
; application .env (QUEUE_CONNECTION=database is the documented default).
environment=APP_ENV="production"